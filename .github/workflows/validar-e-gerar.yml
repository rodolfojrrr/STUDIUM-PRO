name: Validar e gerar aplicativos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Analisar e testar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Confirmar pacote sem dados e chaves privadas
        shell: bash
        run: |
          if find . -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.mra' -o -name '*.mra.gz' -o -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.pem' -o -name '*.key' -o -name 'ASSINATURA_ANDROID_SECRETS.txt' \) | grep -q .; then
            echo 'ERRO: arquivo local de dados ou chave privada encontrado no repositório.'
            exit 1
          fi

      - name: Executar análise estática
        run: flutter analyze

      - name: Executar testes
        run: flutter test

  android:
    name: Gerar APK Android
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MRA_KEYSTORE_B64: ${{ secrets.MRA_KEYSTORE_B64 }}
      MRA_KEYSTORE_PASSWORD: ${{ secrets.MRA_KEYSTORE_PASSWORD }}
      MRA_KEY_ALIAS: ${{ secrets.MRA_KEY_ALIAS }}
      MRA_KEY_PASSWORD: ${{ secrets.MRA_KEY_PASSWORD }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Validar configuração da assinatura Android
        shell: bash
        run: |
          values=("$MRA_KEYSTORE_B64" "$MRA_KEYSTORE_PASSWORD" "$MRA_KEY_ALIAS" "$MRA_KEY_PASSWORD")
          filled=0
          for value in "${values[@]}"; do
            if [ -n "$value" ]; then filled=$((filled + 1)); fi
          done
          if [ "$filled" -ne 4 ]; then
            echo 'ERRO: configure os quatro Secrets MRA_* com a assinatura do APK instalado antes de gerar uma atualização.'
            exit 1
          fi

      - name: Preparar assinatura Android fixa
        shell: bash
        run: echo "$MRA_KEYSTORE_B64" | base64 --decode > android/app/mra-release.jks

      - name: Compilar APK
        env:
          MRA_KEYSTORE_FILE: ${{ github.workspace }}/android/app/mra-release.jks
        run: flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Studium-SI-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Gerar aplicativo Windows
    needs: validar
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      FLUTTER_VERSION: '3.47.2'
      FLUTTER_WINDOWS_SHA256: '37934f2128a55d77a38baba12fd611157ed23a47bf7d2b7d17e9e84da118409d'
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Restaurar cache do Flutter Windows
        id: flutter_windows_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}\flutter-windows-3.47.2
          key: flutter-windows-x64-3.47.2-37934f2128a55d77a38baba12fd611157ed23a47bf7d2b7d17e9e84da118409d

      - name: Configurar Flutter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $flutterRoot = Join-Path $env:RUNNER_TOOL_CACHE "flutter-windows-$env:FLUTTER_VERSION"
          $flutterBin = Join-Path $flutterRoot 'flutter\bin'
          $flutterExe = Join-Path $flutterBin 'flutter.bat'

          if (-not (Test-Path $flutterExe)) {
            $archive = Join-Path $env:RUNNER_TEMP "flutter_windows_$env:FLUTTER_VERSION-stable.zip"
            $url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_$env:FLUTTER_VERSION-stable.zip"

            for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                if (Test-Path $archive) {
                  Remove-Item $archive -Force
                }
                Write-Host "Baixando Flutter oficial, tentativa $attempt de 5..."
                Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing -TimeoutSec 900
                break
              } catch {
                if ($attempt -eq 5) {
                  throw
                }
                Write-Warning "Tentativa $attempt falhou. Uma nova tentativa será feita automaticamente."
                Start-Sleep -Seconds (10 * $attempt)
              }
            }

            $downloadHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($downloadHash -ne $env:FLUTTER_WINDOWS_SHA256) {
              throw "O SDK do Flutter baixado não passou na verificação SHA-256."
            }

            if (Test-Path $flutterRoot) {
              Remove-Item $flutterRoot -Recurse -Force
            }
            New-Item -ItemType Directory -Path $flutterRoot -Force | Out-Null
            Expand-Archive -Path $archive -DestinationPath $flutterRoot -Force
            Remove-Item $archive -Force
          }

          if (-not (Test-Path $flutterExe)) {
            throw 'A configuração do Flutter não foi concluída.'
          }

          $flutterBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "FLUTTER_ROOT=$(Join-Path $flutterRoot 'flutter')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $flutterExe --version

      - name: Habilitar Windows e instalar dependências
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Compilar Windows
        run: flutter build windows --release

      - name: Compactar pacote Windows
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Studium-SI-Windows.zip

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Gerar instalador Windows
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\MyRoutineActive.iss'

      - name: Publicar aplicativo Windows
        uses: actions/upload-artifact@v4
        with:
          name: Studium-SI-Windows
          path: |
            Studium-SI-Windows.zip
            ENTREGAS/Studium-SI-Setup.exe
          if-no-files-found: error
